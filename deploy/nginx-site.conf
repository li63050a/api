# AI API 中转站 nginx 站点配置示例
# 用法：把本文件放入 /etc/nginx/conf.d/ 或 sites-available 并启用，然后：
#   nginx -t && nginx -s reload
#
# 要求：PHP-FPM 已启用 pdo_sqlite / curl / mbstring / openssl / json / session 扩展；
#       data/ 目录对 php-fpm 用户可写。
#
# 关键点：
#  - 应用不依赖 URL 重写，调用方 base_url = https://域名/index.php
#  - /index.php/v1/...、/admin/index.php、/user/index.php 全部交给 PHP-FPM
#  - 无静态资源（纯 SPA 内联），因此除 php 外无需额外 location

server {
    listen 80;
    server_name api.example.com;      # 换成你的域名
    root /var/www/api;                 # 换成项目实际路径
    index index.php;

    client_max_body_size 50m;          # 上游大请求体
    keepalive_timeout 120;             # 与 upstream_timeout=120 对齐

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # 所有 .php 入口（index.php / admin/index.php / user/index.php）
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # 按实际 fpm socket 调整
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # 拒绝访问运行时数据目录
    location ~ ^/(data|logs)/ { deny all; return 404; }
}

